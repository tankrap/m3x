name: Publish to npm

# Publishes @ibx34/m3x, @ibx34/m3x-tokens, @ibx34/m3x-primitives.
#
# Two ways to run it:
#   1. Tag a release:            git tag v0.1.0 && git push --tags
#   2. Manually from the Actions tab (workflow_dispatch) on any ref.
#
# Requires the NPM_TOKEN repository secret: an npm token with publish rights
# for the ibx34 account (Granular Access Token with read/write packages,
# or a classic Automation token).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build
      - name: Publish packages
        run: pnpm -r publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}